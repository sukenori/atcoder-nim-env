services:
  atcoder-nim:
    build: .
    image: atcoder-nim
    container_name: atcoder-nim

    # entrypoint は atcoder-nim-env 専用処理を実行し、最後に dotfiles 初期化へ委譲する
    entrypoint:
      - /bin/bash
      - /home/sukenori/atcoder-nim-env/entrypoint.sh

    volumes:
      # dotfiles をコンテナ内の /root/dotfiles にマウント
      - ../dotfiles:/root/dotfiles
      # 開発用ディレクトリをマウント
      - .:/home/sukenori/atcoder-nim-env
      # cp-nim-lib をマウント
      - ../cp-nim-lib:/home/sukenori/cp-nim-lib
      # nim-acl をマウント
      - ../nim-acl:/home/sukenori/nim-acl
      # cp-solved-log をマウント
      - ../cp-solved-log:/home/sukenori/cp-solved-log
      # .vscode と nim.code-snippets をマウント
      - ../atcoder-nim-env/vscode:/home/sukenori/.vscode
      - ../atcoder-nim-env/.nvim/snippets/vscode/nim.code-snippets:/home/sukenori/.vscode/nim.code-snippets

    # 開発作業を行うメインディレクトリ
    working_dir: /home/sukenori/atcoder-nim-env

    # コンテナを落とさずに維持し続ける（entrypoint の最後でこれに引き継がれる）
    command: tail -f /dev/null
